<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de contenido</title>
<style>
  :root { --cl-bg:#1d1238; --cl-accent:#ff5fb0; --cl-text:#fbf6ff; --cl-muted:#cfc4e6; --bg:#0d0a1f; --bg2:#1d1238; --pink:#ff5fb0; --pink-soft:rgba(255,95,176,.35); --pink-track:rgba(255,255,255,.08);
    --card:rgba(30,20,58,.72); --line:rgba(255,255,255,.10); --text:#fbf6ff; --text-2:#cfc4e6; --muted:#8e82ab; --moon:#f8e7a8; --ok:#4cc38a; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; min-height:100vh; color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(ellipse 900px 700px at 50% 260px, #3a1f5c 0%, var(--bg2) 45%, var(--bg) 100%) no-repeat, var(--bg); }
  #stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  #stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; animation:tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity:.2; } }
  .wrap { position:relative; z-index:1; max-width:980px; margin:0 auto; padding:24px 16px 60px; }
  h1 { margin:0; text-align:center; font-size:clamp(26px,5vw,38px); color:var(--pink); text-shadow:0 0 22px rgba(255,95,176,.5); }
  .meta { text-align:center; color:var(--muted); font-size:14px; margin-top:6px; }
  .clock-row { display:flex; align-items:center; justify-content:center; gap:20px; margin:26px 0 6px; }
  .clock { font-size:clamp(64px,14vw,112px); font-weight:800; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums; }
  .moon { width:clamp(56px,11vw,90px); filter:drop-shadow(0 0 18px rgba(248,231,168,.55)); }
  .sub { text-align:center; color:var(--pink); font-weight:700; font-size:18px; min-height:24px; }
  .tasks { display:flex; flex-direction:column; gap:12px; margin:24px auto 0; max-width:640px; }
  .task { display:grid; grid-template-columns:44px 1fr 32px; align-items:center; gap:12px; padding:14px 16px; border-radius:16px;
    background:var(--card); border:1px solid var(--line); backdrop-filter:blur(6px); transition:border-color .3s, box-shadow .3s; }
  .task.trabajando { border-color:var(--pink); box-shadow:0 0 24px rgba(255,95,176,.25); }
  .task.hecho { border-color:var(--pink-soft); }
  .task svg.ic { width:28px; height:28px; stroke:var(--text-2); fill:none; stroke-width:1.8; justify-self:center; }
  .task.trabajando svg.ic, .task.hecho svg.ic { stroke:var(--pink); }
  .task .t { font-weight:700; font-size:16px; }
  .task .d { color:var(--muted); font-size:12.5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar { height:6px; border-radius:999px; background:var(--pink-track); margin-top:9px; overflow:hidden; }
  .bar > div { height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#ff7ac0,var(--pink)); transition:width .8s ease; }
  .task.trabajando .bar > div { background-size:200% 100%; animation:sh 1.4s linear infinite;
    background-image:linear-gradient(90deg,var(--pink) 0%,#ffb3d9 50%,var(--pink) 100%); }
  @keyframes sh { to { background-position:-200% 0; } }
  .check { width:28px; height:28px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; }
  .hecho .check { background:var(--pink); border-color:var(--pink); }
  .hecho .check::after { content:""; width:6px; height:12px; border:solid #2a0b1d; border-width:0 3px 3px 0; transform:translateY(-1px) rotate(45deg); }
  .error .check { border-color:var(--bad); color:var(--bad); font-weight:800; } .error .check::after { content:"!"; }
  .trabajando .check { border-color:var(--pink); border-right-color:transparent; animation:r .8s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  .pill-row { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:20px 0 6px; }
  .pill { padding:9px 18px; border-radius:999px; font-weight:800; background:var(--pink); color:#2a0b1d; box-shadow:0 0 22px rgba(255,95,176,.45); }
  button, select { font:inherit; font-size:14px; font-weight:600; border-radius:12px; padding:9px 14px; cursor:pointer; border:1px solid var(--line);
    background:var(--card); color:var(--text); }
  button:hover { border-color:var(--pink); } button:disabled { opacity:.5; cursor:not-allowed; }
  .top { display:flex; gap:8px; justify-content:center; margin-top:12px; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:flex-end; justify-content:center; z-index:50; padding:10px; }
  .sheet.open { display:flex; }
  .sheet > form { width:min(560px,100%); max-height:90vh; overflow:auto; background:var(--bg2); border:1px solid var(--pink); border-radius:18px; padding:16px; }
  .sheet h3 { margin:0 0 8px; color:var(--pink); }
  .sheet label { display:block; font-size:13px; color:var(--text-2); margin:10px 0 4px; }
  .sheet input, .sheet textarea, .sheet select { width:100%; font:inherit; font-size:15px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  .sheet textarea { min-height:110px; resize:vertical; }
  .sheet .chk { display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--text-2); margin-top:12px; }
  .sheet .chk input { width:auto; margin-top:3px; }
  .info { text-align:center; color:var(--muted); font-size:13px; }
  .panel { margin-top:34px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; backdrop-filter:blur(6px); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); padding-bottom:12px; }
  .tabs button.on { background:var(--pink); color:#2a0b1d; border-color:var(--pink); }
  .tabs .sp { flex:1; }
  .content { padding-top:16px; line-height:1.6; color:var(--text-2); font-size:15px; }
  .content h2, .content h3 { color:var(--text); margin:18px 0 6px; } .content h2 { font-size:19px; } .content h3 { font-size:16px; }
  .content a { color:#ff9ccf; word-break:break-all; } .content ul { padding-left:20px; margin:6px 0; }
  .content blockquote { margin:10px 0; padding:8px 12px; border-left:3px solid var(--pink); background:rgba(255,95,176,.07); border-radius:6px; }
  .g { border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; background:rgba(13,10,31,.45); }
  .g .head { display:flex; gap:14px; align-items:flex-start; }
  .cover { flex:none; width:88px; aspect-ratio:9/16; border-radius:10px; padding:8px; display:flex; align-items:flex-end;
    background:linear-gradient(160deg,#5b2a86,#ff5fb0); font-weight:800; font-size:12px; line-height:1.15; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.5); }
  .g h3 { margin:0 0 4px; color:var(--text); font-size:17px; } .g .tags { color:var(--muted); font-size:12.5px; }
  .hook { margin-top:12px; padding:10px 12px; border-radius:10px; background:rgba(255,95,176,.12); border:1px solid var(--pink-soft); color:var(--text); font-weight:700; }
  .hook small { display:block; color:var(--pink); font-weight:800; font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:2px; }
  .script { white-space:pre-wrap; margin-top:12px; color:var(--text-2); }
  .script .vis { color:#b9a7ff; font-style:italic; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .lbl { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:800; margin-top:12px; }
  .empty { text-align:center; color:var(--muted); padding:28px 8px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--pink); color:#2a0b1d; padding:10px 16px; border-radius:12px; font-weight:800; opacity:0; transition:opacity .2s; z-index:9; }
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
  <h1>Agente de contenido</h1>
  <div class="meta" id="meta"></div>
  <div class="top"><button type="button" onclick="abrirAjustes()">⚙️ Ajustes</button><button type="button" onclick="Claude.settings('Tu clave de Claude y el modelo que usa la app.')">✳ Claude</button></div>

  <div class="clock-row">
    <div class="clock" id="clock">--:--</div>
    <svg class="moon" viewBox="0 0 100 100" aria-hidden="true"><path d="M62 8a44 44 0 1 0 30 70A38 38 0 0 1 62 8z" fill="var(--moon)"/></svg>
  </div>
  <div class="sub" id="sub"></div>

  <div class="tasks" id="tasks"></div>

  <div class="pill-row" id="pills"></div>
  <div class="info" id="next"></div>

  <div class="panel">
    <div class="tabs">
      <button data-t="guiones" class="on">🎬 Guiones</button>
      <button data-t="competencia">🔍 Competencia</button>
      <button data-t="noticias">📰 Noticias</button>
      <span class="sp"></span>
      <select id="day" aria-label="Noche"></select>
    </div>
    <div class="content" id="content"><div class="empty">Aún no hay resultados. Revisa ⚙️ Ajustes y pulsa «▶ Ejecutar ahora».</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="ajustes" onclick="if(event.target===this)this.classList.remove('open')"><form onsubmit="return guardarAjustes(event)">
  <h3>⚙️ De qué va tu contenido</h3>
  <label>Nicho / tema</label><input name="nicho" required>
  <label>Competidores o referentes (separados por comas, opcional)</label><input name="competidores" placeholder="@creador1, @creador2, canal de YouTube…">
  <label>Plataforma</label><input name="plataforma">
  <label>Idioma</label><input name="idioma">
  <label>País (para las noticias)</label><input name="pais" maxlength="20">
  <label>Número de guiones</label><select name="num_guiones"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
  <label>Tu marca: tono, audiencia y reglas (Claude la lee antes de escribir)</label><textarea name="marca"></textarea>
  <label class="chk"><input type="checkbox" name="auto"> Al abrir la app, preparar el contenido del día si aún no está hecho</label>
  <div class="pill-row" style="justify-content:flex-end"><button type="button" onclick="$('ajustes').classList.remove('open')">Cancelar</button><button class="pill" style="border:0">Guardar</button></div>
</form></div>
<script src="comun/movil.js"></script>
<script src="comun/claude.js"></script>
<script src="datos.js"></script>

<script>
const $ = id => document.getElementById(id);
const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  news: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/>',
  doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
};
const DEFAULT_STEPS = [
  { id:'competencia', titulo:'Investiga a la competencia', icono:'search', progreso:0, estado:'pendiente', detalle:'' },
  { id:'noticias', titulo:'Mira las noticias del día', icono:'news', progreso:0, estado:'pendiente', detalle:'' },
  { id:'guiones', titulo:'Escribe los guiones', icono:'doc', progreso:0, estado:'pendiente', detalle:'' },
];
let INFO = null, NIGHT = null, tab = 'guiones', day = null, timer = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; setTimeout(() => el.style.opacity = 0, 1800); }
async function api(path, opts = {}) {
  return ContenidoLocal.handle(path, opts);   // todo se hace desde el teléfono
}
async function abrirAjustes() {
  const c = await api('api/config'), f = $('ajustes').querySelector('form');
  for (const k of ['nicho', 'competidores', 'plataforma', 'idioma', 'pais', 'marca']) f[k].value = c[k] || '';
  f.num_guiones.value = String(c.num_guiones); f.auto.checked = !!c.auto; $('ajustes').classList.add('open');
}
async function guardarAjustes(e) {
  e.preventDefault(); const f = e.target;
  await api('api/config', { method: 'POST', body: JSON.stringify({ nicho: f.nicho.value.trim(), competidores: f.competidores.value.trim(), plataforma: f.plataforma.value.trim(),
    idioma: f.idioma.value.trim(), pais: f.pais.value.trim(), num_guiones: f.num_guiones.value, marca: f.marca.value.trim(), auto: f.auto.checked }) });
  $('ajustes').classList.remove('open'); toast('Guardado'); refresh(); return false;
}

// Estrellas
(() => { const s = $('stars'); let h = ''; for (let i = 0; i < 90; i++) h += `<i style="left:${Math.random() * 100}%;top:${Math.random() * 100}%;opacity:${.3 + Math.random() * .7};animation-delay:${Math.random() * 3}s;transform:scale(${.5 + Math.random()})"></i>`; s.innerHTML = h; })();

// Reloj
function tick() { $('clock').textContent = new Date().toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' }); }
tick(); setInterval(tick, 1000);

// Markdown mínimo y seguro
function md(src) {
  if (!src) return '<div class="empty">Sin datos para esta noche.</div>';
  const inline = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  let out = '', list = false;
  for (const line of src.split('\n')) {
    const l = line.trimEnd();
    if (/^\s*[-*] /.test(l)) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + inline(l.replace(/^\s*[-*] /, '')) + '</li>'; continue; }
    if (list) { out += '</ul>'; list = false; }
    if (/^#{1,2} /.test(l)) out += '<h2>' + inline(l.replace(/^#+ /, '')) + '</h2>';
    else if (/^#{3,} /.test(l)) out += '<h3>' + inline(l.replace(/^#+ /, '')) + '</h3>';
    else if (/^> /.test(l)) out += '<blockquote>' + inline(l.slice(2)) + '</blockquote>';
    else if (/^\d+\. /.test(l)) out += '<div>' + inline(l) + '</div>';
    else if (l.trim()) out += '<p>' + inline(l) + '</p>';
  }
  return out + (list ? '</ul>' : '');
}
const link = u => /^https?:\/\//.test(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 60))}</a>` : esc(u);

function renderTasks() {
  const st = NIGHT?.estado, steps = st?.pasos || DEFAULT_STEPS, working = INFO?.trabajando;
  $('tasks').innerHTML = steps.map(s => `
    <div class="task ${s.estado}">
      <svg class="ic" viewBox="0 0 24 24">${ICONS[s.icono] || ''}</svg>
      <div style="min-width:0"><div class="t">${esc(s.titulo)}</div>
        <div class="bar"><div style="width:${Math.round((s.progreso || 0) * 100)}%"></div></div>
        <div class="d">${esc(s.detalle || (s.estado === 'pendiente' ? 'En espera' : ''))}${s.busquedas ? ` · ${s.busquedas} búsquedas` : ''}</div></div>
      <div class="check"></div>
    </div>`).join('');
  $('sub').textContent = working ? 'trabajando para ti…' : st?.estado === 'hecho' ? 'contenido listo' : st?.estado === 'error' ? (st.error || 'algo falló') : 'listo para trabajar';
  $('pills').innerHTML = (st?.estado === 'hecho' ? '<span class="pill">Todo en automático</span>' : '') +
    `<button id="run" ${working ? 'disabled' : ''}>${working ? 'Trabajando…' : '▶ Ejecutar ahora'}</button>`;
  $('run').onclick = runNow;
}

function renderContent() {
  const c = $('content');
  if (!NIGHT) { c.innerHTML = '<div class="empty">Aún no hay resultados. Revisa ⚙️ Ajustes y pulsa «▶ Ejecutar ahora».</div>'; return; }
  if (tab !== 'guiones') { c.innerHTML = md(NIGHT[tab]); return; }
  const gs = NIGHT.guiones;
  if (!gs) { c.innerHTML = `<div class="empty">${INFO?.trabajando ? 'Los guiones llegarán en unos minutos…' : 'Este día no se generaron guiones.'}</div>`; return; }
  c.innerHTML = gs.map((g, i) => `
    <article class="g">
      <div class="head"><div class="cover">${esc(g.texto_pantalla)}</div>
        <div><h3>${i + 1}. ${esc(g.titulo)}</h3><div class="tags">${esc(g.formato)} · ~${g.duracion_seg} s</div>
          <div class="hook"><small>Gancho</small>${esc(g.gancho)}</div></div></div>
      <div class="lbl">Guion</div>
      <div class="script">${esc(g.guion).replace(/\[([^\]]+)\]/g, '<span class="vis">[$1]</span>')}</div>
      <div class="lbl">Llamada a la acción</div><div>${esc(g.cta)}</div>
      <div class="lbl">Descripción</div><div style="white-space:pre-wrap">${esc(g.descripcion)}</div>
      <blockquote style="margin-top:12px">💡 ${esc(g.por_que_funciona)}</blockquote>
      ${g.fuentes?.length ? `<div class="lbl">Fuentes</div><div>${g.fuentes.map(link).join(' · ')}</div>` : ''}
      <div class="row"><button data-copy="${i}" data-k="guion">📋 Copiar guion</button><button data-copy="${i}" data-k="descripcion">📋 Copiar descripción</button></div>
    </article>`).join('');
  c.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    const g = gs[+b.dataset.copy], text = b.dataset.k === 'guion' ? `${g.gancho}\n\n${g.guion}\n\n${g.cta}` : g.descripcion;
    Movil.copy(text);
  });
}

async function refresh() {
  try {
    INFO = await api('api/info');
    $('meta').textContent = `${INFO.nicho} · ${INFO.plataforma}`;
    $('next').textContent = INFO.trabajando ? 'Mantén la app abierta unos minutos mientras trabaja' : `${INFO.num_guiones} guiones · ${INFO.auto ? 'se prepara solo al abrir la app cada día' : 'pulsa ▶ cuando quieras'}`;
    const sel = $('day');
    if (!day || !INFO.noches.includes(day)) day = INFO.noches[0] || null;
    sel.innerHTML = INFO.noches.map(d => `<option value="${d}" ${d === day ? 'selected' : ''}>${new Date(d + 'T00:00').toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short' })}</option>`).join('') || '<option>Sin noches</option>';
    NIGHT = day ? await api('api/noche/' + day) : null;
  } catch (e) { toast('⚠️ ' + e.message); }
  renderTasks(); renderContent();
  clearTimeout(timer); timer = setTimeout(refresh, INFO?.trabajando ? 2000 : 30000);
}

async function runNow() {
  try { await api('api/ejecutar', { method:'POST' }); toast('¡A trabajar!'); day = null; setTimeout(refresh, 600); } catch (e) { toast('⚠️ ' + e.message); }
}
document.querySelectorAll('.tabs [data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('.tabs [data-t]').forEach(x => x.classList.toggle('on', x === b)); renderContent(); });
$('day').onchange = e => { day = e.target.value; refresh(); };
refresh();
if (ContenidoLocal.autoStart()) setTimeout(runNow, 800);
</script>
</body>
</html>
